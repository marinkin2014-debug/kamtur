# ============================================================
# cargo-audit конфигурация
# ============================================================
#
# `cargo audit` читает этот файл автоматически.
# Каждое исключение документируется: что за CVE, почему не применимо,
# и что должно произойти, чтобы исключение сняли.

[advisories]
# RUSTSEC-2023-0071: Marvin Attack в rsa 0.9.10.
#
# ## Откуда тянется
#
# Транзитивно через sqlx-macros-core -> sqlx-mysql -> rsa.
# sqlx-mysql в проект не подключён (мы используем только postgres),
# но Cargo.lock содержит его запись, потому что workspace собирается
# под все платформы и features.
#
# ## Почему не применимо
#
# Marvin Attack — адаптивная chosen-ciphertext атака на RSA-дешифрование,
# позволяющая восстановить приватный ключ через timing side-channel.
# В нашем рантайме RSA не используется:
#
#   - TLS через rustls 1.3 -> ECDHE, не RSA.
#   - PostgreSQL через TLS -> ECDHE.
#   - SMTP через TLS -> ECDHE.
#   - Собственного RSA-кода нет.
#
# Уязвимость требует, чтобы приложение само расшифровывало
# атакующий-контролируемый RSA-шифротекст. У нас такой операции нет.
#
# ## Что снимет исключение
#
# Обновление sqlx до версии, где sqlx-mysql не тянет уязвимый rsa
# (фикс ожидается в sqlx 0.9+). Либо переход на прямую зависимость
# sqlx-postgres вместо sqlx с метапакетом.
#
# Проверять раз в квартал.
ignore = ["RUSTSEC-2023-0071"]
