# ============================================================
# Kamtur CI — fmt, clippy, test, audit, deny
# ============================================================
#
# Jobs:
#
#   1. `check`  — fmt + clippy. Matrix: [stable, beta].
#   2. `test`   — сборка + все тесты с Postgres. Matrix: [stable, beta].
#   3. `audit`  — RustSec-проверка (компактный отчёт).
#   4. `deny`   — политика зависимостей: лицензии, banned, sources.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgres://test:test@localhost:5432/kamtur_test
  DATABASE_URL: postgres://test:test@localhost:5432/kamtur_test
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ============================================================
  # 1. fmt + clippy — matrix stable + beta
  # ============================================================
  check:
    name: fmt + clippy (${{ matrix.rust }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-check-${{ matrix.rust }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ============================================================
  # 2. test — matrix stable + beta, с Postgres
  # ============================================================
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kamtur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-${{ matrix.rust }}

      - name: cargo test --workspace
        run: cargo test --workspace

  # ============================================================
  # 3. audit — RustSec-уязвимости
  # ============================================================
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-audit
          cache-targets: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  # ============================================================
  # 4. deny — политика зависимостей
  # ============================================================
  #
  # Используем официальный action: он кэширует бинарь cargo-deny,
  # устанавливает toolchain и запускает check за ~30 секунд.
  # `cargo install cargo-deny` занял бы 2-3 минуты.
  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
          arguments: --all-features
          manifest-path: ./Cargo.toml