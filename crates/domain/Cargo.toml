[package]
name = "domain"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
hex.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
pretty_assertions.workspace = true

# ============================================================
# Benchmarks
# ============================================================
#
# `harness = false` — criterion предоставляет собственный main,
# стандартный libtest-harness не нужен.
#
# `sha2` и `hex` НЕ дублируем в dev-dependencies: benches автоматически
# видят `[dependencies]` пакета (проверено: api/tests/*.rs использует
# `async_trait`, `axum`, `chrono` из `[dependencies]` api).
[[bench]]
name = "fingerprint"
harness = false
