[package]
name = "infrastructure"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
domain = { path = "../domain" }

async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
lettre.workspace = true
metrics.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
zstd.workspace = true

[dev-dependencies]
criterion.workspace = true
dotenvy.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["test-util"] }
uuid.workspace = true

# ============================================================
# Benchmarks
# ============================================================
#
# `harness = false` — criterion предоставляет собственный main,
# стандартный libtest-harness не нужен.
#
# `benches/common/mod.rs` не компилируется как отдельный bench
# (Cargo собирает только `benches/*.rs`). Подключается через
# `mod common;` из bench-файлов.
[[bench]]
name = "parser"
harness = false

[[bench]]
name = "transform"
harness = false
