[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/worker",
    "crates/api",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Traits / errors
async-trait = "0.1"
thiserror = "2"
anyhow = "1"

# Serialization / parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"

# Data types
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["db-postgres"] }

# Crypto / hashing
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# DB
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "macros", "migrate",
    "chrono", "rust_decimal",
] }

# Compression
zstd = "0.13"

# HTTP / Email
lettre = { version = "0.11", default-features = false, features = [
    "builder", "smtp-transport", "tokio1-rustls-tls", "pool",
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }

# Scheduler
cron = "0.12"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
metrics-process = "2"

# Web
axum = "0.7"
axum-prometheus = "0.6"           # 0.7 требует axum 0.8 — несовместимо
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "sensitive-headers"] }
http-body = "1"
http-body-util = "0.1"
ipnet = "2.9"

# Config
dotenvy = "0.15"

# Utilities
uuid = { version = "1", features = ["v4"] }

# Test
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
