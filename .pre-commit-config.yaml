# ============================================================
# Pre-commit hooks для kamtur
# ============================================================
#
# Установка:
#   Windows:  .\scripts\install-hooks.ps1
#   *nix:     ./scripts/install-hooks.sh
#
# Ручной запуск:
#   pre-commit run --all-files                              # всё, на всех файлах
#   pre-commit run cargo-clippy                             # один хук, на staged
#   pre-commit run --hook-stage pre-push --all-files        # pre-push-стадию
#
# Обновление версий хуков из сторонних репо:
#   pre-commit autoupdate
#
# Документация: docs/pre-commit.md
# ============================================================
#
# ФИЛОСОФИЯ
#
# Стадии разделены по стоимости:
#
#   pre-commit — быстро (<10 сек в горячем кэше). Только то, что не
#                читает сеть / БД / большой диск. Если хук медленный,
#                разработчики начнут коммитить с `--no-verify`, и хуки
#                станут бесполезны.
#
#   pre-push   — можно минуты. Здесь — тесты, интеграционные проверки,
#                всё, что требует окружения (Postgres).
#
# CI (.github/workflows/ci.yml) — источник истины. Локальные хуки
# дублируют только то, что дешевле поймать локально; всё остальное
# остаётся в CI, чтобы не устраивать рассинхрон.
#
# Команды хуков совпадают с CI посимвольно. Если менять clippy-флаги
# в CI — менять и здесь. Рассинхрон «-D warnings локально, -W в CI»
# (или наоборот) ломает доверие к хукам.
# ============================================================

# Ставим оба типа git-хуков при `pre-commit install`.
# `default_install_hook_types` появился в 3.3.0; до этого pre-push
# приходилось регистрировать отдельной командой `--hook-type pre-push`.
default_install_hook_types:
  - pre-commit
  - pre-push

# Хуки без явного `stages` работают только на pre-commit.
# `cargo-test` переопределяет на pre-push.
default_stages:
  - pre-commit

minimum_pre_commit_version: '3.3.0'

# Не останавливаемся на первой ошибке: разработчику полезно увидеть
# сразу все проблемы (fmt + trailing whitespace + EOF), а не идти
# итерациями «исправил → коммит → новая ошибка → исправил».
fail_fast: false

repos:
  # ============================================================
  # 1. Гигиена файлов (быстро, без зависимостей)
  # ============================================================
  #
  # Пин на конкретный тег — воспроизводимость между машинами.
  # Обновление через `pre-commit autoupdate`, затем `pre-commit run
  # --all-files` для валидации, что ничего не сломалось.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # --- Whitespace / line endings ---
      #
      # `--markdown-linebreak-ext=md`: в markdown два пробела в конце
      # строки значат <br>. Без флага хук их съест и сломает разметку.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

      - id: end-of-file-fixer

      # Приводим к LF. Синхронизировано с .gitattributes (`* text=auto eol=lf`).
      # На Windows core.autocrlf может дать CRLF в рабочей копии —
      # хук приведёт к каноничному LF до коммита.
      - id: mixed-line-ending
        args: [--fix=lf]

      # --- Структурные проверки ---
      #
      # Ловят синтаксические ошибки в CI-конфигах, дашбордах, миграциях
      # до push'а. PyYAML 1.1, как и GitHub Actions.
      - id: check-yaml
      - id: check-toml

      - id: check-merge-conflict
      - id: check-case-conflict

      # --- Безопасность ---
      #
      # 1 MB — компромисс: бинарники, дампы, экспортированные XLSX
      # не должны попадать в репо. Легитимные крупные файлы добавляем
      # в `exclude` с обоснованием.
      - id: check-added-large-files
        args: [--maxkb=1024]

      # Дешёвая страховка: не даём закоммитить PEM/SSH-ключи.
      # Не заменяет gitleaks/trufflehog (в CI), но отсекает 90% случайных.
      - id: detect-private-key

  # ============================================================
  # 2. Rust: проверки (language: system)
  # ============================================================
  #
  # `language: system` — использует cargo/rustfmt из PATH, не тянет
  # свой toolchain. У разработчика и CI один и тот же rustup-stable.
  #
  # `pass_filenames: false` — cargo-команды принимают workspace, а не
  # список файлов; pre-commit не передаёт имена. Фильтр `files:` тут
  # нужен лишь как триггер: «запускай хук, если в коммите есть
  # изменённые .rs/.toml».
  - repo: local
    hooks:
      # ----------------------------------------------------------
      # Форматирование.
      # ----------------------------------------------------------
      #
      # `--check`, а не auto-fix: cargo fmt форматирует ВСЁ дерево,
      # включая незастейдженные WIP-файлы. Если разработчик работает
      # параллельно над фичей — авто-фикс молча тронет её, и следующий
      # `git add -u` подхватит чужие изменения в этот коммит.
      # `--check` — honest gate: упал, сам разберёшься, что добавить.
      #
      # Инкрементально пролетает за доли секунды. Холодный первый
      # прогон — тоже быстро (rustfmt не компилирует).
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        files: '\.rs$'
        pass_filenames: false

      # ----------------------------------------------------------
      # Clippy с `-D warnings` — те же флаги, что в CI.
      # ----------------------------------------------------------
      #
      # Триггерится на .rs И .toml: правка Cargo.toml (features,
      # зависимости) может изменить вывод clippy для зависимых крейтов.
      #
      # Первый прогон холодный: cargo компилирует workspace и все
      # зависимости → минуты. Дальше инкрементальный кэш target/:
      # типично 1-3 сек при изменении одного крейта. Это разовая плата.
      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: '\.(rs|toml)$'
        pass_filenames: false

  # ============================================================
  # 3. Rust: тесты (pre-push)
  # ============================================================
  #
  # `cargo test --workspace` на pre-push. Требует TEST_DATABASE_URL
  # (см. docs/pre-commit.md). Если БД не поднята — push заблокируется.
  # Это намеренно: пушить непроверенный код дороже, чем поднять контейнер.
  #
  # Триггер на .sql (миграции): изменение схемы ломает тесты, но не
  # меняет ни одного .rs-файла — без .sql в фильтре хук бы не запустился.
  - repo: local
    hooks:
      - id: cargo-test
        name: cargo test --workspace (pre-push)
        entry: cargo test --workspace
        language: system
        files: '\.(rs|toml|sql)$'
        pass_filenames: false
        stages: [pre-push]
